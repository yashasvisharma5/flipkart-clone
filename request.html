<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request - Blood Bank Management System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-tint me-2"></i>
                Blood Bank Management
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="donor.html">Donor Registration</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="request.html">Blood Request</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-danger text-white text-center py-4">
                        <h2 class="mb-0">
                            <i class="fas fa-hand-holding-medical me-2"></i>
                            Blood Request
                        </h2>
                        <p class="mb-0 mt-2">Request blood for medical emergencies</p>
                    </div>
                    <div class="card-body p-5">
                        <form id="requestForm">
                            <!-- Patient Information Section -->
                            <h5 class="text-danger mb-3">
                                <i class="fas fa-user-injured me-2"></i>Patient Information
                            </h5>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="patientName" class="form-label">Patient Name</label>
                                    <input type="text" class="form-control" id="patientName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="patientAge" class="form-label">Patient Age</label>
                                    <input type="number" class="form-control" id="patientAge" min="1" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="patientGender" class="form-label">Gender</label>
                                    <select class="form-select" id="patientGender" required>
                                        <option value="">Select Gender</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="contactNumber" class="form-label">Contact Number</label>
                                    <input type="tel" class="form-control" id="contactNumber" required>
                                </div>
                            </div>
                            
                            <!-- Blood Request Details Section -->
                            <h5 class="text-danger mb-3 mt-4">
                                <i class="fas fa-tint me-2"></i>Blood Request Details
                            </h5>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="requiredBloodType" class="form-label">Required Blood Type</label>
                                    <select class="form-select" id="requiredBloodType" required>
                                        <option value="">Select Blood Type</option>
                                        <option value="A+">A+</option>
                                        <option value="A-">A-</option>
                                        <option value="B+">B+</option>
                                        <option value="B-">B-</option>
                                        <option value="AB+">AB+</option>
                                        <option value="AB-">AB-</option>
                                        <option value="O+">O+</option>
                                        <option value="O-">O-</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="unitsRequired" class="form-label">Units Required</label>
                                    <input type="number" class="form-control" id="unitsRequired" min="1" max="10" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="urgency" class="form-label">Urgency Level</label>
                                    <select class="form-select" id="urgency" required>
                                        <option value="">Select Urgency</option>
                                        <option value="emergency">Emergency (Within 1 hour)</option>
                                        <option value="urgent">Urgent (Within 24 hours)</option>
                                        <option value="routine">Routine (Within 3 days)</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="requestDate" class="form-label">Required Date</label>
                                    <input type="date" class="form-control" id="requestDate" required>
                                </div>
                            </div>
                            
                            <!-- Hospital Information Section -->
                            <h5 class="text-danger mb-3 mt-4">
                                <i class="fas fa-hospital me-2"></i>Hospital Information
                            </h5>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="hospitalName" class="form-label">Hospital Name</label>
                                    <input type="text" class="form-control" id="hospitalName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="doctorName" class="form-label">Doctor Name</label>
                                    <input type="text" class="form-control" id="doctorName" required>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="hospitalAddress" class="form-label">Hospital Address</label>
                                <textarea class="form-control" id="hospitalAddress" rows="3" required></textarea>
                            </div>
                            
                            <!-- Medical Reason Section -->
                            <h5 class="text-danger mb-3 mt-4">
                                <i class="fas fa-notes-medical me-2"></i>Medical Information
                            </h5>
                            
                            <div class="mb-3">
                                <label for="medicalReason" class="form-label">Reason for Blood Request</label>
                                <textarea class="form-control" id="medicalReason" rows="4" placeholder="Please describe the medical condition requiring blood transfusion" required></textarea>
                            </div>
                            
                            <!-- Contact Person Section -->
                            <h5 class="text-danger mb-3 mt-4">
                                <i class="fas fa-user-friends me-2"></i>Contact Person Details
                            </h5>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="contactPersonName" class="form-label">Contact Person Name</label>
                                    <input type="text" class="form-control" id="contactPersonName" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="relation" class="form-label">Relation to Patient</label>
                                    <input type="text" class="form-control" id="relation" required>
                                </div>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="contactPersonPhone" class="form-label">Contact Person Phone</label>
                                    <input type="tel" class="form-control" id="contactPersonPhone" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="contactPersonEmail" class="form-label">Contact Person Email</label>
                                    <input type="email" class="form-control" id="contactPersonEmail" required>
                                </div>
                            </div>
                            
                            <!-- Submit Button -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-danger btn-lg">
                                    <i class="fas fa-paper-plane me-2"></i>
                                    Submit Blood Request
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="js/script.js"></script>
</body>
</html>
